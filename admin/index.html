<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floodgate Admin</title>
  <style>
    :root {
      /* Floodgate operator console — one flow accent over cool hydraulic
         neutrals. Existing --color-* names are re-pointed so the whole surface
         re-skins coherently; semantic tokens below carry the console identity. */
      --color-primary: #0e7490;
      --color-primary-dark: #155e75;
      --color-error: #dc2626;
      --color-error-bg: #fef2f2;
      --color-success: #15803d;
      --color-gray-50: #f5f7fa;
      --color-gray-100: #eef2f7;
      --color-gray-200: #e2e8f0;
      --color-gray-300: #cbd5e1;
      --color-gray-500: #475569;
      --color-gray-700: #334155;
      --color-gray-900: #0f172a;

      /* Semantic surfaces and ink */
      --surface: #f5f7fa;
      --surface-raised: #ffffff;
      --surface-sunken: #eef2f7;
      --ink: #0f172a;
      --ink-muted: #475569;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;

      /* Flow accent (water/flow), with a brighter variant for dark chrome */
      --accent: #0e7490;
      --accent-strong: #155e75;
      --accent-weak: #e0f2fe;
      --accent-on-dark: #22d3ee;

      /* Dark command chrome + code/data console */
      --panel: #0f172a;
      --panel-raised: #1e293b;
      --panel-border: rgba(148, 163, 184, 0.22);
      --ink-on-dark: #e2e8f0;
      --ink-on-dark-muted: #94a3b8;
      --console-bg: #0f172a;
      --console-ink: #e2e8f0;

      /* Precise state colors */
      --success-surface: #ecfdf3;
      --success-text: #166534;
      --danger: #dc2626;
      --danger-strong: #b91c1c;
      --danger-text: #b91c1c;
      --danger-surface: #fef2f2;
      --warning-text: #b45309;

      --radius: 0.375rem;
      --radius-lg: 0.5rem;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 6px 16px -6px rgba(15, 23, 42, 0.18);

      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background-color: var(--surface);
      color: var(--ink);
      line-height: 1.5;
    }

    /* Tabular figures wherever numbers are scanned or compared. */
    .mono, .data-table, .tenant-id, .doc-id, .op-sn, .detail-value,
    .secret-value, .seq-input { font-variant-numeric: tabular-nums; }

    /* Browser surfaces themed from the palette, not defaults. */
    ::selection { color: white; background: var(--accent); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    html {
      scrollbar-color: var(--border-strong) var(--surface);
      scrollbar-width: thin;
      accent-color: var(--accent);
    }
    a { color: var(--accent); }

    /* Visually hidden, still announced by assistive technology. */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .skip-link {
      position: fixed;
      inset-block-start: 0.5rem;
      inset-inline-start: 0.5rem;
      z-index: 10;
      padding: 0.625rem 0.875rem;
      border-radius: 0.375rem;
      color: white;
      background: var(--color-gray-900);
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .auth-card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-form { display: flex; flex-direction: column; gap: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .form-group label { font-size: 0.875rem; font-weight: 500; color: var(--color-gray-700); }
    .form-group input {
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font-size: 1rem;
      background: var(--surface-raised);
      color: var(--ink);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(14, 116, 144, 0.18);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease,
        color 120ms ease;
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background-color: var(--accent); color: white; }
    form .btn-primary { width: 100%; }
    .btn-primary:hover:not(:disabled) { background-color: var(--accent-strong); }
    .btn-primary:active:not(:disabled) { background-color: var(--accent-strong); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-github { background-color: #1f2733; color: #fff; width: 100%; }
    .btn-github:hover:not(:disabled) { background-color: #111826; }
    .btn-github:active:not(:disabled) { background-color: #0b111c; }
    .btn-github:disabled { opacity: 0.55; cursor: not-allowed; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.5rem 0;
      color: var(--color-gray-500);
      font-size: 0.875rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--color-gray-300);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--color-gray-500);
    }
    .auth-footer a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
    .auth-footer a:hover { text-decoration: underline; }

    .alert {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    .alert-error {
      background-color: var(--danger-surface);
      border: 1px solid #fecaca;
      color: var(--danger-text);
    }
    .alert-icon { font-weight: bold; }

    .authenticated-layout { min-height: 100vh; display: flex; flex-direction: column; }
    .nav {
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      padding: 0.625rem 1.5rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      justify-content: space-between;
    }
    .nav-brand a { text-decoration: none; }
    .nav-brand .brand-name {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    /* Stream/sequence mark: three cyan channels reading as flow. */
    .nav-brand .brand-name::before {
      content: '';
      width: 0.1875rem;
      height: 1.05rem;
      margin-inline-end: 0.75rem;
      background: var(--accent-on-dark);
      box-shadow:
        0.375rem 0 0 var(--accent-on-dark),
        0.75rem 0 0 var(--accent-on-dark);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-inline-end: auto;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      color: var(--ink-on-dark-muted);
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 120ms ease, background-color 120ms ease;
    }
    .nav-link:hover { color: #fff; background: var(--panel-raised); }
    .nav-link:focus-visible {
      outline: 2px solid var(--accent-on-dark);
      outline-offset: 2px;
    }
    .nav-link-active {
      color: #fff;
      background: rgba(34, 211, 238, 0.12);
      box-shadow: inset 0 -2px 0 var(--accent-on-dark);
    }
    .nav-user { display: flex; align-items: center; gap: 1rem; }
    .nav-user p {
      min-width: 0;
      max-width: 16rem;
      overflow: hidden;
      color: var(--ink-on-dark-muted);
      font-size: 0.875rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-user button {
      min-height: 2.5rem;
      padding: 0.375rem 0.75rem;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink-on-dark);
      background: transparent;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 120ms ease;
    }
    .nav-user button:hover { background: var(--panel-raised); }
    .nav-user button:focus-visible {
      outline: 2px solid var(--accent-on-dark);
      outline-offset: 2px;
    }

    .main-content { flex: 1; padding: 1.5rem; }

    .dashboard { max-width: 1200px; margin: 0 auto; }
    .dashboard-header { margin-bottom: 1.5rem; }
    .dashboard-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
    .dashboard-content { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .welcome-card { grid-column: 1 / -1; }
    .dashboard-card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .dashboard-card h2 { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 0.5rem; }
    .dashboard-card p { color: var(--ink-muted); font-size: 0.875rem; }

    .page { max-width: 1200px; margin: 0 auto; }
    .page h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 1rem; }
    .page p { color: var(--ink-muted); }

    .not-found { text-align: center; padding: 4rem 1rem; }
    .not-found h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .not-found a { display: inline-block; margin-top: 1rem; color: var(--color-primary); text-decoration: none; }
    .not-found a:hover { text-decoration: underline; }

    /* Page header with title and action button */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .page-title { margin-bottom: 0; }

    /* Back link */
    .back-link {
      color: var(--color-gray-500);
      text-decoration: none;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }
    .back-link:hover { color: var(--color-primary); }

    /* Cards */
    .card {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1rem;
    }
    .card h2 { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 0.75rem; }
    .form-card { max-width: 500px; }

    /* Rotation help card */
    .help-card p { color: var(--ink-muted); font-size: 0.875rem; }
    .help-card .help-subhead {
      margin-top: 0.875rem;
      color: var(--ink);
      font-weight: 700;
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .help-card .steps {
      margin: 0.5rem 0 0.875rem 1.1rem;
      display: grid;
      gap: 0.375rem;
      color: var(--ink-muted);
      font-size: 0.875rem;
    }
    .help-card .steps li { padding-inline-start: 0.25rem; }
    .help-card .help-warning {
      padding: 0.625rem 0.75rem;
      border-inline-start: 3px solid var(--warning-text);
      background: #fffbeb;
      color: #92400e;
      border-radius: var(--radius);
      font-size: 0.8125rem;
    }

    /* Tenant table/list */
    .tenant-list { list-style: none; }
    .tenant-row {
      border-top: 1px solid var(--color-gray-200);
      padding: 0.75rem 0;
    }
    .tenant-row a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      min-width: 0;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .tenant-row a:hover .tenant-name { text-decoration: underline; }
    .tenant-row .tenant-name { min-width: 0; overflow-wrap: anywhere; }
    .tenant-row .tenant-id {
      flex: none;
      color: var(--ink-muted);
      font-weight: 400;
      font-size: 0.8125rem;
      font-family: var(--font-mono);
    }

    /* Tenant form */
    .tenant-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-help { color: var(--color-gray-500); font-size: 0.75rem; margin-top: 0.25rem; }

    /* Detail page */
    .tenant-detail-content { display: flex; flex-direction: column; gap: 1rem; max-width: 600px; }
    .detail-row { display: flex; gap: 1rem; padding: 0.5rem 0; }
    .detail-label { font-weight: 500; color: var(--color-gray-500); min-width: 5rem; }
    .detail-value { font-family: var(--font-mono); }

    /* States */
    .loading-state, .empty-state, .error-state { padding: 2rem; text-align: center; }
    .error-state .btn { margin-top: 1rem; }

    /* Tenant count and preview on dashboard */
    .tenant-count { font-weight: 500; margin-bottom: 0.5rem; }
    .tenant-item { padding: 0.25rem 0; }
    .tenant-item a { color: var(--color-primary); text-decoration: none; font-family: var(--font-mono); }
    .tenant-item a:hover { text-decoration: underline; }
    .view-all-link { display: inline-block; margin-top: 0.75rem; color: var(--color-primary); text-decoration: none; font-size: 0.875rem; }
    .view-all-link:hover { text-decoration: underline; }

    /* Danger zone */
    .danger-card { border: 1px solid #fca5a5; }
    .danger-card h2 { color: var(--danger-text); }
    .btn-danger { background-color: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background-color: var(--danger-strong); }
    .btn-danger:active:not(:disabled) { background-color: var(--danger-strong); }
    .btn-danger:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      background-color: var(--surface-raised);
      color: var(--color-gray-700);
      border: 1px solid var(--border-strong);
    }
    .btn-secondary:hover { background-color: var(--surface-sunken); }
    .btn-secondary:active { background-color: var(--surface-sunken); }
    .delete-confirm { margin-top: 1rem; }
    .delete-warning { color: var(--danger-text); font-weight: 600; margin-bottom: 0.5rem; }
    .delete-tenant-id { font-family: var(--font-mono); font-weight: 600; background: var(--surface-sunken); padding: 0.25rem 0.5rem; border-radius: 0.25rem; display: inline-block; margin-bottom: 0.75rem; }
    .delete-confirm-input { border-color: var(--danger) !important; }
    .delete-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

    /* Success alert */
    .alert-success { background-color: var(--success-surface); border: 1px solid #bbf7d0; color: var(--success-text); display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.875rem; }
    .app-flash {
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto 1rem;
    }
    .app-flash p { color: inherit; }
    .flash-dismiss {
      min-height: 2.5rem;
      padding: 0.375rem 0.75rem;
      border: 1px solid currentColor;
      border-radius: var(--radius);
      color: inherit;
      background: transparent;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    /* Secret display */
    .secret-display { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
    .secret-value { font-size: 0.8125rem; background: var(--surface-sunken); padding: 0.5rem 0.75rem; border-radius: var(--radius); word-break: break-all; flex: 1; }
    .btn-sm { min-height: 2.5rem; padding: 0.375rem 0.75rem; font-size: 0.8125rem; }
    .regenerate-confirm { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
    .tenant-name { font-weight: 600; }
    .tenant-id-small { color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.8125rem; }

    /* Document operations console */
    .document-detail-page,
    .document-list-page { max-width: 1440px; }
    .document-detail-content { min-width: 0; }
    .page-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      min-width: 0;
    }
    .page-title-row .page-title {
      overflow-wrap: anywhere;
    }
    .tab-bar {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
      padding: 0.25rem;
      overflow-x: auto;
      background: var(--surface-sunken);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      scrollbar-width: thin;
    }
    .tab-btn {
      min-height: 2.5rem;
      padding: 0.5rem 0.875rem;
      border: 0;
      border-radius: var(--radius);
      color: var(--ink-muted);
      background: transparent;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: color 120ms ease, background-color 120ms ease;
    }
    .tab-btn:hover { color: var(--ink); background: var(--surface-raised); }
    .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .tab-btn-active {
      color: var(--accent);
      background: var(--surface-raised);
      box-shadow: var(--shadow-sm), inset 0 -2px 0 var(--accent);
    }
    .tab-panel { outline: none; }
    .tab-panel:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: var(--radius-lg);
    }
    .data-list { list-style: none; }
    .data-row { border-top: 1px solid var(--color-gray-200); }
    .data-row > a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 3.25rem;
      padding: 0.75rem 0;
      color: var(--color-gray-900);
      text-decoration: none;
    }
    .data-row > a:hover .doc-id { color: var(--color-primary); }
    .doc-id {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--color-gray-700);
      font-weight: 600;
    }
    .doc-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: none;
      color: var(--color-gray-500);
      font-size: 0.8125rem;
    }
    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      flex: none;
    }
    .status-active { background: var(--color-success); }
    .status-inactive { background: var(--color-gray-500); }
    .status-label { color: var(--color-gray-700); }
    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .text-muted { color: var(--ink-muted); }
    .session-info {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    /* Op stream: dense ruled scan, not nested cards. */
    .op-stream {
      display: grid;
    }
    .op-entry {
      min-width: 0;
      padding: 0.75rem 0;
    }
    .op-entry + .op-entry { border-top: 1px solid var(--border); }
    .op-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.375rem 0.75rem;
      font-size: 0.8125rem;
    }
    .op-sn { color: var(--accent); font-weight: 700; }
    .op-client {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink-muted);
    }
    .op-meta { margin-inline-start: auto; color: var(--ink-muted); }
    .op-type {
      padding: 0.0625rem 0.4375rem;
      border-radius: 999px;
      background: var(--accent-weak);
      color: var(--accent-strong);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .op-contents,
    .git-content,
    .code-block {
      max-width: 100%;
      max-height: min(60vh, 32rem);
      overflow: auto;
      padding: 0.875rem;
      border-radius: var(--radius);
      color: var(--console-ink);
      background: var(--console-bg);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.65;
      tab-size: 2;
    }
    .op-contents { margin-top: 0.5rem; }
    .op-contents pre,
    .git-content pre,
    .code-block { white-space: pre; }
    .load-more {
      display: flex;
      justify-content: center;
      padding-top: 1rem;
    }
    .data-table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .document-detail-content .card,
    .git-object { overflow-x: auto; }
