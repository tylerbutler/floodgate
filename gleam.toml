name = "floodgate"
version = "0.1.0"
description = "Fluid Framework server on Beryl with Socket.IO and Phoenix Channels transports"
licences = ["MIT"]
target = "erlang"
gleam = ">= 1.13.0"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_erlang = ">= 0.29.0 and < 2.0.0"
gleam_otp = ">= 0.12.0 and < 2.0.0"
gleam_crypto = ">= 1.0.0 and < 2.0.0"
# Only for session.gleam's `call_doc`, which turns a call against a
# just-stopped document actor into a retry instead of a crashed caller.
exception = ">= 2.0.0 and < 3.0.0"
beryl = { git = "https://github.com/tylerbutler/beryl", ref = "main", path = "packages/beryl" }
dewdrop = { git = "https://github.com/tylerbutler/dewdrop", ref = "main" }
beryl_mist = { git = "https://github.com/tylerbutler/beryl", ref = "main", path = "packages/beryl_mist" }
spillway = { git = "https://github.com/tylerbutler/spillway", ref = "main" }
signet = { git = "https://github.com/tylerbutler/signet", ref = "main" }
silt = { git = "https://github.com/tylerbutler/silt", ref = "main" }
windsock = { git = "https://github.com/tylerbutler/windsock", ref = "main" }
mist = ">= 6.0.0 and < 7.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
shelf = ">= 1.0.1 and < 2.0.0"
# GitHub OAuth for the admin session.
vestibule = { git = "https://github.com/tylerbutler/vestibule.git", ref = "main" }
vestibule_github = { git = "https://github.com/tylerbutler/vestibule.git", ref = "main", path = "packages/vestibule_github" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[tools.trellis]
members = [".", "admin"]

[tools.trellis.publish]
exact_tag_format = "v{version}"

# The admin UI ships with the server; neither package publishes to Hex.
[tools.trellis.publish.lifecycle]
default = "workspace"
packages = { "." = "git_only" }
