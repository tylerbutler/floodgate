name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/cache@v4
        with:
          path: |
            build
            admin/build
          key: ${{ runner.os }}-gleam-${{ hashFiles('manifest.toml', 'admin/manifest.toml') }}
      - run: gleam deps download
      - run: gleam format --check
      - run: gleam test
      - run: cd admin && gleam deps download && gleam format --check && gleam test && gleam build --target javascript

  client-and-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm build && pnpm test && pnpm check
        working-directory: client
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: website

  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage: [memory, shelf]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - name: Start Floodgate
        env:
          FLOODGATE_JWT_SECRET: floodgate-routerlicious-compat-secret
          FLOODGATE_TOKEN_MINT_SECRET: floodgate-routerlicious-mint-secret
          FLOODGATE_STORAGE_BACKEND: ${{ matrix.storage }}
        run: |
          gleam run > /tmp/floodgate.log 2>&1 &
          echo $! > /tmp/floodgate.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/floodgate.log
          exit 1
      - run: pnpm test:routerlicious
        working-directory: client
      - run: pnpm test:phoenix
        working-directory: client
      - run: pnpm check:floodgate-readiness-manifest
        working-directory: client
      - if: always()
        run: |
          test ! -f /tmp/floodgate.pid || kill "$(cat /tmp/floodgate.pid)" || true
          cat /tmp/floodgate.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: floodgate:ci
      - name: Verify container
        run: |
          docker run -d --name floodgate-ci \
            -p 3000:3000 \
            -e FLOODGATE_JWT_SECRET=ci-secret \
            -e FLOODGATE_STORAGE_BACKEND=memory \
            floodgate:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          docker logs floodgate-ci
          exit 1
