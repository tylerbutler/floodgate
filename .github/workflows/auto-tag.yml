name: Auto-tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  client-tag:
    if: github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release:client')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: tylerbutler/actions/changie-auto-tag@main
        id: auto-tag
        with:
          working-directory: client
          projects: floodgate-client
          token: ${{ steps.app-token.outputs.token }}
      - if: steps.auto-tag.outputs.created-tags != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CREATED_TAGS: ${{ steps.auto-tag.outputs.created-tags }}
        run: gh workflow run "Client npm Publish" --field tags="$CREATED_TAGS"
