name: Client Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - uses: tylerbutler/actions/changie-release@ed7d5e5f1d4370a5ccf06503916e3c301102ab1c # ratchet:tylerbutler/actions/changie-release@main
        with:
          token: ${{ secrets.RELEASE_PAT }}
          working-directory: client
          projects: floodgate-client
          labels: release:client
          pr-title-template: "Release floodgate-client {version}"
          branch-template: release/client-next
          commit-message-template: "chore(client): release {version}"
