name: Client Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - uses: tylerbutler/actions/changie-release@main
        with:
          token: ${{ secrets.RELEASE_PAT }}
          working-directory: client
          projects: floodgate-client
          labels: release:client
          pr-title-template: "Release floodgate-client {version}"
          branch-template: release/client-next
          commit-message-template: "chore(client): release {version}"
