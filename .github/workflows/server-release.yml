name: Server Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: server-release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'pr' }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'tylerbutler/floodgate' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.merged &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'release/server-next'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Trellis
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/tylerbutler/trellis/releases/download/v0.13.0/trellis-gleam-installer.sh | sh
      - run: trellis doctor
      - name: Create or update the server release PR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: trellis release pr --branch release/server-next
      - name: Tag the merged server release
        if: github.event_name == 'pull_request'
        run: trellis tag create --push
