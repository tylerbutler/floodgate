# Docker Compose for the standalone Floodgate server.
#
# Mirrors client/packages/levee-driver/docker-compose.yml (which runs the Levee
# Elixir server on :4000) so the same integration suites can be pointed at
# either stack. Floodgate serves both wire protocols from this one process:
#
#   HTTP:              http://localhost:3000
#   Socket.IO:         http://localhost:3000/socket.io/     (official Fluid drivers)
#   Phoenix Channels:  ws://localhost:3000/socket/websocket (levee-driver/levee-client)
#
# Usage:
#   docker compose up -d --wait     # Start (builds from local source)
#   docker compose down -v          # Stop and drop the storage volume
#   docker compose logs -f floodgate

services:
  floodgate:
    image: floodgate:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FLOODGATE_TENANT_ID=fluid
      # Matches LEVEE_TENANT_KEY in the levee-driver compose file so the
      # existing Levee integration suites authenticate unchanged.
      - FLOODGATE_JWT_SECRET=dev-tenant-secret-key
      - FLOODGATE_TOKEN_MINT_SECRET=dev-token-mint-secret
      - FLOODGATE_PUBLIC_URL=http://localhost:3000
      # Browser clients are served from another origin in the examples.
      - FLOODGATE_ALLOWED_ORIGINS=*
      - FLOODGATE_STORAGE_BACKEND=shelf
      - FLOODGATE_DATA_DIR=/data
    volumes:
      - floodgate-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 5

volumes:
  floodgate-data:
